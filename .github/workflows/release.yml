name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          ./build.ps1 -Version $version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ClaudeUsageTraySetup
          path: dist/ClaudeUsageTraySetup.exe
          if-no-files-found: error
      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/ClaudeUsageTraySetup.exe --draft --verify-tag --generate-notes
